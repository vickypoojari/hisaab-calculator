name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: pure-JVM engine tests, no Android SDK needed.
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:parser:test --no-daemon

  build:
    runs-on: ubuntu-latest
    needs: parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-debug.html
          if-no-files-found: ignore
